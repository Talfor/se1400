<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Krameri Studios</title>
    <link rel="icon" type="image/x-icon" href="../images/KrameriStudiosLogo.ico">
    <link rel="stylesheet" href="style.css">
    <script src="java.js" defer></script>
</head>

<body>

    <header>
        
        <img class="title" src="../images/title.png" alt="Krameri Studios Title">
        <nav>
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="about.html">About</a>
            <a href="support.html">Support</a>
        </nav>
    </header>

    <main>

        <section id="description">
            <h2>Contact Us</h2>
            <p>
                If you have any concerns, bug reports, or feature requests, please submit a form below.
                <br><br>
            </p>
        </section>

        <section id="members">
            <h2>Form</h2>
            <form
                action="https://formbold.com/s/FORM_ID"
                method="POST"
                enctype="multipart/form-data"
                class="flex flex-col gap-8"
                >
                <div class="flex flex-col gap-4">
                    <!-- Reporter -->
                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div class="flex flex-col gap-2">
                        <label for="name" class="text-sm font-medium text-gray-700">Your name <span class="font-normal text-gray-500">(Optional)</span></label>
                        <input type="text" name="name" id="name" placeholder="Jane Cooper" class="max-h-11 w-full rounded-xl border border-gray-300 bg-white px-4 py-2.5 text-base text-gray-900 transition-all placeholder:text-[#9ca3af] focus:border-[#5750f1] focus:ring-4 focus:ring-[#5750f1]/10 focus:outline-none" />
                    </div>
                    <div class="flex flex-col gap-2">
                        <label for="email" class="text-sm font-medium text-gray-700">Email<span class="ml-0.5 font-medium text-red-500">*</span></label>
                        <input type="email" name="email" id="email" placeholder="you@example.com" class="max-h-11 w-full rounded-xl border border-gray-300 bg-white px-4 py-2.5 text-base text-gray-900 transition-all placeholder:text-[#9ca3af] focus:border-[#5750f1] focus:ring-4 focus:ring-[#5750f1]/10 focus:outline-none" required />
                    </div>
                    </div>

                    <!-- Severity and environment -->
                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div class="flex flex-col gap-2">
                        <label for="severity" class="text-sm font-medium text-gray-700">Severity<span class="ml-0.5 font-medium text-red-500">*</span></label>
                        <select name="severity" id="severity" class="max-h-11 w-full rounded-xl border border-gray-300 bg-white px-4 py-2.5 text-base text-gray-900 transition-all focus:border-[#5750f1] focus:ring-4 focus:ring-[#5750f1]/10 focus:outline-none" required>
                        <option value="">Select severity</option>
                        <option value="Idea">Idea or Feature Suggestion</option>
                        <option value="Bug">Bug Report</option>
                        <option value="Appeal">Ban/Suspension Appeal</option>
                        <option value="Account">Account Hacked or Compromised</option>
                        <option value="Other">Other</option>
                        </select>
                    </div>
                    </div>

                    <!-- Steps to reproduce -->
                    <div class="flex flex-col gap-2">
                    <label for="steps" class="text-sm font-medium text-gray-700">Ticket Subject<span class="ml-0.5 font-medium text-red-500">*</span></label>
                    <textarea rows="1" name="steps" id="steps" placeholder="SUBJECT" class="w-full resize-y rounded-xl border border-gray-300 bg-white px-4 py-3 text-base text-gray-900 transition-all placeholder:text-[#9ca3af] focus:border-[#5750f1] focus:ring-4 focus:ring-[#5750f1]/10 focus:outline-none" required></textarea>
                    </div>

                    <!-- Expected vs actual -->
                    <div class="flex flex-col gap-2">
                    <textarea rows="6" name="expected_vs_actual" placeholder="DESCRIPTION" id="expected_vs_actual" class="w-full resize-y rounded-xl border border-gray-300 bg-white px-4 py-3 text-base text-gray-900 transition-all placeholder:text-[#9ca3af] focus:border-[#5750f1] focus:ring-4 focus:ring-[#5750f1]/10 focus:outline-none" required></textarea>
                    </div>

                    <!-- Attachment -->
                    <div class="flex flex-col gap-2">
                    <label for="screenshot" class="text-sm font-medium text-gray-700">Screenshot or recording <span class="font-normal text-gray-500">(Optional)</span></label>
                    <input type="file" name="screenshot" id="screenshot" accept="image/*,video/*" class="w-full h-11 rounded-xl border border-gray-300 bg-white px-2.5 py-2 text-base text-gray-900 transition-all file:mr-4 file:rounded-lg file:border-0 file:bg-gray-100 file:px-2 file:py-0.5 file:text-sm file:font-medium file:text-gray-700 hover:file:bg-gray-200 focus:border-[#5750f1] focus:ring-4 focus:ring-[#5750f1]/10 focus:outline-none" />
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" class="flex h-12 w-full cursor-pointer items-center justify-center gap-2 rounded-xl bg-[#111827] px-5 py-3 text-base font-medium text-white shadow-xs transition-all hover:bg-black active:scale-[0.99]">Submit Form</button>
                </form>

        </section>

    </main>

    <footer>
        <img class="logo" src="../images/KrameriStudiosLogo.png" alt="Krameri Studios Logo">
        <p>Krameri Studios &copy; Copyright 2026</p>
        <p>talfor0001@outlook.com</p>
    </footer>

</body>

</html>
